<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente neon fúcsia para lilás brilhante idêntico à logo da LehTech -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d946ef;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- APENAS O MONITOR DE COMPUTADOR DA LOGO LEHTECH -->
  <g>
    <!-- Tela do Monitor (Espessa e nítida para alta legibilidade em 16x16) -->
    <rect x="10" y="10" width="80" height="56" rx="8" stroke="url(#neonGradient)" stroke-width="4.5" fill="none" />
    
    <!-- Pé/Suporte do Monitor -->
    <path d="M 38 66 L 30 84 L 70 84 L 62 66" stroke="url(#neonGradient)" stroke-width="4.5" stroke-linejoin="round" fill="none" />
    <line x1="22" y1="84" x2="78" y2="84" stroke="url(#neonGradient)" stroke-width="4.5" stroke-linecap="round" />

    <!-- Cartão Interno do Avatar/Usuário na Esquerda (Assinatura do design) -->
    <rect x="20" y="20" width="24" height="30" rx="5" stroke="url(#neonGradient)" stroke-width="3.2" fill="none" />
    <!-- Cabeça do Avatar -->
    <circle cx="32" cy="29" r="4.5" stroke="url(#neonGradient)" stroke-width="2.5" fill="none" />
    <!-- Ombros do Avatar -->
    <path d="M 25 44 Q 25 39 32 39 Q 39 39 39 44" stroke="url(#neonGradient)" stroke-width="2.5" fill="none" />
  </g>
</svg>